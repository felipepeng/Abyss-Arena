<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abyss Arena</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #05080f;
        overflow: hidden;
      }
      body { display: flex; align-items: center; justify-content: center; }
      /* O CSS só decide o tamanho na tela, mantendo 16:9 (letterbox). A imagem interna
         acompanha esse tamanho em pixels reais (core/display.ts), para a arte vetorial
         ficar nítida; o jogo continua pensando em 960 × 540 lógicos. */
      #game {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #061021;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
