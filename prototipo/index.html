<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Abissal — protótipo de combate (descartável)</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05080f; color: #cfe6ff;
    font-family: ui-monospace, Consolas, monospace;
    overflow: hidden;
  }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: #061021; image-rendering: pixelated; cursor: crosshair; max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
"use strict";

// =============================================================================
// PROTÓTIPO DESCARTÁVEL — combate subaquático. Arte = formas geométricas.
// Todos os números de ajuste vivem aqui. Tempos em ms, velocidades em px/s.
// Suposições anotadas com "SUP:".
// =============================================================================
const CONFIG = {
  view: { w: 960, h: 540 },
  tile: 20,                       // SUP: grade de 20px, arena do tamanho da tela (sem câmera)
  sim: { hz: 60 },                // passo fixo de 60 Hz
  maxFrameMs: 100,                // SUP: limite de acúmulo para não "correr" após travadas

  input: {
    // atacar sem mouse: qualquer uma dessas teclas faz a mesma estocada do
    // clique, inclusive segurar para carregar
    attackKeys: ["KeyJ", "KeyK", "Enter", "NumpadEnter"],
    dashKeys: ["Space", "ShiftLeft", "ShiftRight", "KeyL"],
    // no modo teclado a mira segue a direção do nado (WASD/setas); mexer o
    // mouse devolve a mira para o cursor
    keyboardAimFollowsMovement: true,
  },

  player: {
    radius: 9,
    accel: 1500,                  // aceleração do nado
    maxSpeed: 250,
    drag: 3.4,                    // arrasto da água (quanto maior, menos inércia)
    hp: 100,
    dash: { speed: 640, durationMs: 140, cooldownMs: 1200 }, // sem invulnerabilidade
    hurt: { invulnMs: 667, knockback: 330, blinkMs: 80 },
  },

  spear: {
    anticipationMs: 70,
    thrustMs: 120,
    recoveryMs: 180,
    reach: 52,                    // alcance base da ponta
    reachChargeBonus: 40,         // alcance extra com carga cheia
    chargeMaxMs: 600,
    lungeSpeed: 320,              // impulso do jogador para a frente na estocada
    lungeChargeBonus: 280,
    damage: 16,
    damageChargeBonus: 20,
    tipRadius: 10,                // raio da hitbox da ponta
    hitStopMs: 60,                // congela a simulação ao acertar
    enemyKnockback: 430,
    selfRecoil: 230,              // recuo do jogador só quando acerta
  },

  fish: {                         // (a) peixe que persegue e investe em linha reta
    radius: 11, hp: 34, speed: 118, accel: 900, drag: 3.0,
    sightR: 300,
    telegraphMs: 400,             // brilha antes de avançar
    chargeMs: 480, chargeSpeed: 430,
    recoverMs: 520,
    contactDamage: 9,
    knockbackTakenMult: 1,
  },

  circler: {                      // (b) criatura que circula e ataca de perto
    radius: 13, hp: 46, speed: 132, accel: 1000, drag: 3.2,
    orbitR: 92, orbitSpeed: 1.9,  // rad/s ao redor do jogador
    windupMs: 300, strikeMs: 220, strikeSpeed: 380, restMs: 700,
    contactDamage: 11,
  },

  spawn: {
    firstDelayMs: 1200,
    intervalMs: 2600,             // SUP: ritmo constante, sem escalada de dificuldade
    intervalMinMs: 1100,
    intervalDecayMs: 90,          // acelera um pouco a cada spawn
    maxAlive: 9,
    minDistFromPlayer: 220,
    pauseDuringBoss: true,        // com o boss vivo, só o chamado dele invoca peixes
  },

  boss: {                         // caranguejo gigante (tecla B)
    radius: 38,                   // raio visual
    collRadius: 23,               // raio de colisão: menor, para caber nos corredores
    unstickAfterMs: 1500,         // parado tempo demais => recolocado no espaço livre mais próximo
    hp: 420, speed: 90, accel: 700, drag: 2.6,
    phase2At: 0.5,                // abaixo de 50% muda o padrão
    thinkMs: 900,                 // pausa entre ataques (fase 1)
    thinkMsP2: 520,
    dash: { telegraphMs: 620, telegraphMsP2: 420, durationMs: 620, speed: 520, speedP2: 640, damage: 20 },
    pinch: { telegraphMs: 520, telegraphMsP2: 360, activeMs: 180, radius: 118, radiusP2: 150, damage: 24 },
    call: { telegraphMs: 700, count: 3 },
    contactDamage: 12,
    name: "CARANGUEJO ABISSAL", rageLabel: "ENFURECIDO",
  },

  jelly: {                        // água-viva colossal (tecla N) — o oposto do caranguejo:
    name: "ÁGUA-VIVA COLOSSAL",   // flutua, mantém distância e ataca de longe
    rageLabel: "INCANDESCENTE",
    radius: 42,                   // raio visual (o sino)
    collRadius: 25,
    hp: 380, speed: 80, accel: 540, drag: 2.2,
    hoverDist: 215,               // distância que tenta manter do jogador
    hoverBias: -55,               // e um pouco acima dele
    phase2At: 0.5,
    thinkMs: 800, thinkMsP2: 440,
    contactDamage: 10,
    unstickAfterMs: 1500,
    ring: {                       // anel de esporos em todas as direções
      telegraphMs: 620, telegraphMsP2: 440,
      count: 14, countP2: 20,
      waves: 1, wavesP2: 3, waveGapMs: 190, waveTwist: 0.22,
      speed: 195, damage: 11, lifeMs: 4200, r: 6,
    },
    beam: {                       // raio que varre a arena girando
      telegraphMs: 700, telegraphMsP2: 520,
      sweepMs: 1100, sweepMsP2: 1400,
      // ATENÇÃO: a velocidade tangencial do raio à distância de flutuação é
      // sweepSpeed * hoverDist. Acima de player.maxSpeed (250) fica impossível
      // de desviar nadando — em 215px o teto é ~1,16 rad/s. Fica com margem.
      sweepSpeed: 0.85, sweepSpeedP2: 1.0,  // rad/s (183 e 215 px/s de tangencial)
      length: 640, halfWidth: 11, damage: 16,
      innerGap: 48,               // colar na água-viva é seguro: o raio só começa aqui
      blockedByRock: true,        // a rocha faz sombra — dá cobertura de verdade
      oncePerSweep: true,         // uma varredura machuca no máximo uma vez
      // a ponta do raio SAI da água-viva e viaja até você: sem isso ele nascia
      // com o comprimento inteiro já sobre o jogador e acertava no primeiro frame.
      // O tempo de reação que isso dá é distância / growSpeed (em 215px, ~350ms).
      growSpeed: 620,             // px/s de avanço da ponta
      rotateAfterExtend: true,    // só começa a girar depois de esticar
      armDelayMs: 130,            // piso de reação: de perto a ponta chegaria quase junto
    },
    pull: {                       // sucção: puxa o jogador e cospe ferrões de perto
      telegraphMs: 520, durationMs: 1100,
      force: 640, radius: 330,
      stingerEveryMs: 150, stingerSpeed: 250, stingerSpread: 0.5,
      damage: 9, lifeMs: 2600, r: 5,
    },
  },

  eye: {                          // OLHO DO ABISMO (tecla M) — boss bullet hell
    name: "OLHO DO ABISMO", rageLabel: "DESPERTO",
    radius: 46, collRadius: 30, hp: 560,
    speed: 72, accel: 430, drag: 2.4,
    keepDist: 300,                // tenta não deixar o jogador colar nele
    driftR: 260,                  // vagueia dentro desse raio do centro da arena
    phaseAt: [1, 0.66, 0.33],     // limiares de vida das 3 fases
    thinkMs: [700, 520, 380],
    contactDamage: 14,
    unstickAfterMs: 1500,
    arena: {                      // mapa próprio: grande e aberto
      w: 1860, h: 1100,
      pillars: 26,                // formações de rocha que servem de cobertura
      // fração das pedras que sobra em cada fase: na 1 dá para usar cobertura,
      // depois elas vão sumindo até a arena ficar totalmente aberta
      pillarKeepByPhase: [1, 0.45, 0],
    },
    fan: {                        // leque mirado — a cobertura funciona contra este
      telegraphMs: 520, telegraphMsP3: 380,
      count: [5, 7, 9], spread: 0.85, volleys: [2, 2, 3], volleyGapMs: 170,
      speed: 230, damage: 10, lifeMs: 5000, r: 6,
    },
    spiral: {                     // espiral contínua — cobertura ajuda em parte
      telegraphMs: 600, durationMs: [2000, 2400, 2600],
      arms: [1, 2, 3], emitEveryMs: 70, spinSpeed: 2.3,
      speed: 200, damage: 10, lifeMs: 6000, r: 6,
    },
    siege: {                      // CERCO: nasce num anel em volta do jogador e fecha.
      telegraphMs: 700,           // vem de todos os lados, então esconder não resolve
      ringR: 430, count: [18, 24, 30],
      speed: 215, damage: 12, lifeMs: 5000, r: 7,
    },
    seekers: {                    // perseguidores que ATRAVESSAM a rocha (fase 2+)
      telegraphMs: 620,
      count: [0, 5, 8], speed: 135, turnRate: 1.5,
      damage: 11, lifeMs: 7000, r: 8,
    },
    rain: {                       // chuva vinda do alto da arena (fase 3)
      telegraphMs: 700, durationMs: 2200, everyMs: 90,
      spreadX: 620, speed: 260, damage: 10, lifeMs: 6000, r: 6,
    },
  },

  projectiles: {
    maxAlive: 900,                // bullet hell precisa de espaço
    popBySpear: true,
    // impactos desgastam a rocha: acampar atrás de uma pedra a destrói
    erodeRock: true, erodeChance: 0.3,
  },

  camera: { lerp: 0.12, lookAhead: 60 },

  particles: { bubbleLifeMs: 720, deathCount: 18, hitCount: 10 },
};

// =============================================================================
// utilidades
// =============================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const len = (x, y) => Math.hypot(x, y);
function angLerp(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = CONFIG.view.w, H = CONFIG.view.h;
const TS = CONFIG.tile;
const BORDER = 2 * TS;   // espessura da parede de borda da caverna, em px
// O mundo pode ser maior que a visão (arena do Olho do Abismo). W/H são a
// janela; world.w/world.h são a arena. A câmera acompanha o jogador.
let world = { w: W, h: H };
let COLS = Math.floor(W / TS), ROWS = Math.floor(H / TS);
const cam = { x: 0, y: 0 };

// =============================================================================
// entrada
// =============================================================================
const keys = Object.create(null);
const keyPressed = Object.create(null);   // flanco de subida, consumido no fim do passo
// viewX/viewY são coordenadas de tela; x/y são as mesmas em coordenadas de
// mundo, recalculadas a cada passo (a câmera se move mesmo com o mouse parado)
const mouse = { x: W / 2, y: H / 2, viewX: W / 2, viewY: H / 2, down: false, pressed: false, released: false };

addEventListener("keydown", (e) => {
  if (!keys[e.code]) keyPressed[e.code] = true;   // ignora a repetição automática do teclado
  keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter" || e.code.startsWith("Arrow")) e.preventDefault();
  if (e.code === "KeyR") resetGame();
  if (e.code === "KeyB") spawnBoss();
  if (e.code === "KeyN") spawnJelly();
  if (e.code === "KeyM") spawnEye();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

const anyKey = (list) => list.some((c) => keys[c]);
const anyKeyPressed = (list) => list.some((c) => keyPressed[c]);

// entrada de ataque unificada: clique esquerdo ou tecla de ataque
const attackHeld = () => mouse.down || anyKey(CONFIG.input.attackKeys);
const attackPressed = () => mouse.pressed || anyKeyPressed(CONFIG.input.attackKeys);

// direção do nado pelas teclas (usada no movimento e na mira do modo teclado)
function moveDir() {
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1;
  if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) y -= 1;
  if (keys.KeyS || keys.ArrowDown) y += 1;
  const l = len(x, y);
  return l > 0 ? { x: x / l, y: y / l, len: l } : { x: 0, y: 0, len: 0 };
}

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener("mousemove", (e) => {
  const p = canvasPos(e);
  if (p.x !== mouse.viewX || p.y !== mouse.viewY) mouse.moved = true;  // devolve a mira ao cursor
  mouse.viewX = p.x; mouse.viewY = p.y;
});
cv.addEventListener("mousedown", (e) => { if (e.button === 0) { mouse.down = true; mouse.pressed = true; e.preventDefault(); } });
addEventListener("mouseup", (e) => { if (e.button === 0) { mouse.down = false; mouse.released = true; } });
cv.addEventListener("contextmenu", (e) => e.preventDefault());

// =============================================================================
// arena: caverna fechada com chão irregular e formações de rocha
// =============================================================================
let grid = new Uint8Array(COLS * ROWS);
let pillars = [], pillarsTotal = 0;   // grupos de tiles dos pilares da arena aberta
const solid = (cx, cy) => (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) ? 1 : grid[cy * COLS + cx];
const solidAtPx = (x, y) => solid(Math.floor(x / TS), Math.floor(y / TS));

// arena grande e aberta do Olho do Abismo: água limpa, só a borda e pilares
// espalhados que servem de cobertura e vão sumindo a cada fase
function buildOpenArena() {
  const A = CONFIG.eye.arena;
  world = { w: A.w, h: A.h };
  COLS = Math.floor(world.w / TS); ROWS = Math.floor(world.h / TS);
  grid = new Uint8Array(COLS * ROWS);
  pillars = [];

  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
    if (x < 2 || y < 2 || x >= COLS - 2 || y >= ROWS - 2) grid[y * COLS + x] = 1;

  // pilares em anel, longe do centro (onde o boss nasce) e da borda
  const cx = COLS / 2, cy = ROWS / 2;
  let tentativas = 0;
  while (pillars.length < A.pillars && tentativas++ < 900) {
    const ang = rand(0, TAU), rr = rand(0.22, 0.92);
    const px = Math.round(cx + Math.cos(ang) * rr * (COLS / 2 - 6));
    const py = Math.round(cy + Math.sin(ang) * rr * (ROWS / 2 - 6));
    if (px < 5 || py < 5 || px >= COLS - 5 || py >= ROWS - 5) continue;
    if (Math.hypot(px - cx, py - cy) < 7) continue;         // centro livre
    const rx = rand(1.3, 2.9), ry = rand(1.3, 2.9);
    const grupo = [];
    for (let dx = -4; dx <= 4; dx++) for (let dy = -4; dy <= 4; dy++) {
      if ((dx / rx) ** 2 + (dy / ry) ** 2 <= 1 + rand(-0.15, 0.15)) {
        const tx = px + dx, ty = py + dy;
        if (tx < 3 || ty < 3 || tx >= COLS - 3 || ty >= ROWS - 3) continue;
        const idx = ty * COLS + tx;
        if (!grid[idx]) { grid[idx] = 1; grupo.push(idx); }
      }
    }
    if (grupo.length) pillars.push(grupo);
  }
  pillarsTotal = pillars.length;
}

// dissolve pilares até sobrar a fração pedida do total original
function dissolvePillars(keepFrac) {
  const alvo = Math.floor(pillarsTotal * keepFrac);
  while (pillars.length > alvo) {
    const grupo = pillars.splice(randi(0, pillars.length - 1), 1)[0];
    for (const idx of grupo) {
      grid[idx] = 0;
      if (Math.random() < 0.45) {
        const tx = (idx % COLS) * TS + TS / 2, ty = Math.floor(idx / COLS) * TS + TS / 2;
        bubbles(tx, ty, 1, "#7f9e94", 7, 130);
      }
    }
  }
}

function buildArena(kind) {
  if (kind === "open") { buildOpenArena(); return; }
  world = { w: W, h: H };
  COLS = Math.floor(world.w / TS); ROWS = Math.floor(world.h / TS);
  pillars = []; pillarsTotal = 0;
  grid = new Uint8Array(COLS * ROWS);
  const set = (cx, cy) => { if (cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS) grid[cy * COLS + cx] = 1; };

  // bordas (2 blocos de espessura para dar peso visual)
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
    if (x < 2 || y < 2 || x >= COLS - 2 || y >= ROWS - 2) set(x, y);

  // chão irregular por soma de senos + ruído
  const p1 = rand(0, TAU), p2 = rand(0, TAU);
  for (let x = 0; x < COLS; x++) {
    const h = 2.6 + 1.9 * Math.sin(x * 0.24 + p1) + 1.2 * Math.sin(x * 0.61 + p2) + rand(-0.6, 0.6);
    const d = Math.max(2, Math.round(h));
    for (let k = 0; k < d; k++) set(x, ROWS - 1 - k);
  }
  // teto irregular, mais raso
  for (let x = 0; x < COLS; x++) {
    const h = 1.6 + 1.1 * Math.sin(x * 0.19 - p2) + rand(-0.4, 0.4);
    const d = Math.max(2, Math.round(h));
    for (let k = 0; k < d; k++) set(x, k);
  }

  // formações de rocha: blobs elípticos espalhados (SUP: 5 a 7, longe do centro do spawn)
  const blobs = randi(5, 7);
  for (let i = 0; i < blobs; i++) {
    const bx = randi(6, COLS - 7), by = randi(5, ROWS - 8);
    if (Math.hypot(bx - COLS / 2, by - ROWS / 2) < 6) continue; // deixa o centro livre
    const rx = rand(1.6, 4.2), ry = rand(1.4, 3.4);
    for (let x = -5; x <= 5; x++) for (let y = -5; y <= 5; y++) {
      const n = (x / rx) ** 2 + (y / ry) ** 2;
      if (n <= 1 + rand(-0.18, 0.18)) set(bx + x, by + y);
    }
  }
  // estalactites/estalagmites simples
  for (let i = 0; i < 6; i++) {
    const x = randi(4, COLS - 5), d = randi(2, 5), top = Math.random() < 0.5;
    for (let k = 0; k < d; k++) set(x, top ? 2 + k : ROWS - 3 - k);
  }
}

// abre espaço na rocha (último recurso para garantir lugar para o boss)
function carveRoom(x, y, r) {
  const cx = Math.floor(x / TS), cy = Math.floor(y / TS), cr = Math.ceil(r / TS) + 1;
  for (let dx = -cr; dx <= cr; dx++) for (let dy = -cr; dy <= cr; dy++) {
    const tx = cx + dx, ty = cy + dy;
    // nunca remove a parede de borda, senão o corpo escapa da arena
    if (tx < 2 || ty < 2 || tx >= COLS - 2 || ty >= ROWS - 2) continue;
    if (dx * dx + dy * dy <= cr * cr) grid[ty * COLS + tx] = 0;
  }
}

// devolve um ponto livre para um corpo de raio `clearance`, ou null se não achar
function freeSpot(minDistFrom, minDist, clearance) {
  const r = clearance || 14;
  const lo = BORDER + r;
  if (lo * 2 >= Math.min(world.w, world.h)) return null;
  for (let t = 0; t < 400; t++) {
    const x = rand(lo, world.w - lo), y = rand(lo, world.h - lo);
    if (hitsRock(x, y, r)) continue;
    if (minDistFrom && Math.hypot(x - minDistFrom.x, y - minDistFrom.y) < minDist) continue;
    return { x, y };
  }
  return null;
}

// raio usado na colisão: menor que o visual quando o corpo é grande (boss),
// senão um caranguejo de 38px de raio não passa pelos corredores da caverna
const collRadius = (e) => (e.collR !== undefined ? e.collR : e.radius * 0.85);

// colisão AABB contra a grade, eixo por eixo
function moveAndCollide(e, dt) {
  const r = collRadius(e);
  // se o passo começou com o corpo enfiado na rocha, desencalha antes de mover
  if (hitsRock(e.x, e.y, r)) unstick(e, r);

  e.x += e.vx * dt;
  if (hitsRock(e.x, e.y, r)) {
    const step = e.vx > 0 ? -1 : 1;
    // guarda de iterações: sem ela um corpo totalmente preso empurra para
    // fora da grade (onde tudo é sólido) e o laço nunca termina
    let guard = Math.ceil(Math.abs(e.vx) * dt) + TS + 2;
    while (hitsRock(e.x, e.y, r) && guard-- > 0) e.x += step;
    if (hitsRock(e.x, e.y, r)) unstick(e, r);
    e.vx = 0; e.blockedX = true;
  }
  e.y += e.vy * dt;
  if (hitsRock(e.x, e.y, r)) {
    const step = e.vy > 0 ? -1 : 1;
    let guard = Math.ceil(Math.abs(e.vy) * dt) + TS + 2;
    while (hitsRock(e.x, e.y, r) && guard-- > 0) e.y += step;
    if (hitsRock(e.x, e.y, r)) unstick(e, r);
    e.vy = 0; e.blockedY = true;
  }
  // limita à área jogável (por dentro da parede de borda). Clampar ao canvas
  // enfiava corpos grandes dentro da própria borda, de onde não saíam mais.
  e.x = clamp(e.x, BORDER + r, world.w - BORDER - r);
  e.y = clamp(e.y, BORDER + r, world.h - BORDER - r);
}

// procura em espiral o ponto livre mais próximo e recoloca o corpo lá
function unstick(e, r) {
  const lo = BORDER + r;
  if (lo * 2 >= Math.min(world.w, world.h)) return false;
  for (let ring = TS * 0.5; ring <= TS * 10; ring += TS * 0.5) {
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * TAU + ring * 0.7;
      const x = clamp(e.x + Math.cos(a) * ring, lo, world.w - lo);
      const y = clamp(e.y + Math.sin(a) * ring, lo, world.h - lo);
      if (!hitsRock(x, y, r)) {
        e.x = x; e.y = y; e.vx *= 0.2; e.vy *= 0.2;
        return true;
      }
    }
  }
  // nem isso resolveu: abre espaço na rocha em volta
  carveRoom(e.x, e.y, r + 6);
  return false;
}

// amostra a caixa do corpo com passo menor que um bloco — com apenas os cantos,
// um bloco de 20px passava entre as amostras de um corpo grande
function hitsRock(x, y, r) {
  const n = Math.max(2, Math.ceil((r * 2) / (TS * 0.75)));
  for (let i = 0; i <= n; i++) {
    const px = x - r + (2 * r * i) / n;
    for (let j = 0; j <= n; j++) {
      if (solidAtPx(px, y - r + (2 * r * j) / n)) return true;
    }
  }
  return false;
}

// =============================================================================
// estado
// =============================================================================
let player, enemies, particles, projectiles, boss, game;

function resetGame() {
  buildArena("cave");
  let s = freeSpot(null, 0, CONFIG.player.radius + 2);
  if (!s) { s = { x: world.w / 2, y: world.h / 2 }; carveRoom(s.x, s.y, CONFIG.player.radius + 8); }
  player = {
    x: s.x, y: s.y, vx: 0, vy: 0, radius: CONFIG.player.radius,
    aim: 0, aimMode: "mouse", keyAim: 0, hp: CONFIG.player.hp,
    invulnMs: 0,
    dashMs: 0, dashCdMs: 0, dashDirX: 1, dashDirY: 0,
    spear: { state: "idle", t: 0, chargeMs: 0, charging: false, dirX: 1, dirY: 0, reach: CONFIG.spear.reach, dmg: CONFIG.spear.damage, hitIds: new Set(), didHit: false },
  };
  enemies = [];
  particles = [];
  projectiles = [];
  boss = null;
  game = {
    kills: 0, hitStopMs: 0, timeMs: 0,
    spawnTimerMs: CONFIG.spawn.firstDelayMs, spawnIntervalMs: CONFIG.spawn.intervalMs,
    shakeMs: 0, shakeAmp: 0, dead: false, nextId: 1,
  };
  centerCamera();
}

// ---- câmera: segue o jogador e para nas bordas do mundo ---------------------
function cameraTarget() {
  // olha um pouco à frente da mira, para ver o que vem
  const la = CONFIG.camera.lookAhead;
  const tx = player.x + Math.cos(player.aim) * la - W / 2;
  const ty = player.y + Math.sin(player.aim) * la - H / 2;
  return { x: clamp(tx, 0, Math.max(0, world.w - W)), y: clamp(ty, 0, Math.max(0, world.h - H)) };
}
function centerCamera() { const t = cameraTarget(); cam.x = t.x; cam.y = t.y; }
function updateCamera() {
  const t = cameraTarget();
  cam.x += (t.x - cam.x) * CONFIG.camera.lerp;
  cam.y += (t.y - cam.y) * CONFIG.camera.lerp;
}

function shake(ms, amp) { game.shakeMs = Math.max(game.shakeMs, ms); game.shakeAmp = Math.max(game.shakeAmp, amp); }

// =============================================================================
// partículas (bolhas)
// =============================================================================
function bubbles(x, y, n, color, spread, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(0.25, 1) * (speed || 150);
    particles.push({
      x: x + rand(-spread, spread), y: y + rand(-spread, spread),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      r: rand(1.5, 4.5), life: CONFIG.particles.bubbleLifeMs * rand(0.6, 1.3),
      maxLife: CONFIG.particles.bubbleLifeMs, color: color || "#bfe9ff",
    });
  }
}

// =============================================================================
// inimigos
// =============================================================================
function spawnFish(pos) {
  const p = pos || freeSpot(player, CONFIG.spawn.minDistFromPlayer, CONFIG.fish.radius);
  if (!p) return;                 // caverna sem lugar livre: não nasce nada neste tique
  enemies.push({
    id: game.nextId++, type: "fish", x: p.x, y: p.y, vx: 0, vy: 0,
    radius: CONFIG.fish.radius, hp: CONFIG.fish.hp, maxHp: CONFIG.fish.hp,
    state: "chase", t: 0, dirX: 1, dirY: 0, flash: 0, ang: 0, wob: rand(0, TAU),
  });
}
function spawnCircler() {

  if (!p) return;
  enemies.push({
    id: game.nextId++, type: "circler", x: p.x, y: p.y, vx: 0, vy: 0,

    state: "orbit", t: 0, orbitAng: rand(0, TAU), orbitDir: Math.random() < 0.5 ? -1 : 1,
    dirX: 1, dirY: 0, flash: 0, ang: 0,
  });
}
// ---- Olho do Abismo: troca a arena por uma grande e aberta (tecla M)
function spawnEye() {

  enemies = []; projectiles = []; particles = [];

  boss = {

    pulse: 0, driftAng: rand(0, TAU), aimAng: 0, volley: 0, emitT: 0,
    spiralAng: 0, spiralDir: 1, siegeX: 0, siegeY: 0,
    lastX: centro.x, lastY: centro.y, stillMs: 0,

// ---- água-viva colossal: boss de longo alcance (tecla N)
function spawnJelly() {

function spawnBoss() {
  if (boss) return;
  const cr = CONFIG.boss.collRadius;
  // tenta longe do jogador, depois perto, e por último abre espaço na rocha
  let p = freeSpot(player, 260, cr) || freeSpot(player, 120, cr) || freeSpot(null, 0, cr);
  if (!p) {
    p = { x: world.w / 2, y: world.h / 2 };
    carveRoom(p.x, p.y, cr + 10);
  }
  boss = {

    name: CONFIG.boss.name, rageLabel: CONFIG.boss.rageLabel,
